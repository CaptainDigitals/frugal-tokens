[workspace]
resolver = "2"
members = [
    "crates/frugal-storage",
    "crates/frugal-policy",
    "crates/frugal-telemetry",
    "crates/frugal-hooks",
    "crates/frugal-providers",
    "crates/frugal-core",
    "crates/frugal-mcp",
    "crates/frugal-tui",
    "crates/frugal-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/CaptainDigitals/frugal-tokenomics"

[workspace.dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
dirs = "5"
anyhow = "1"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
ratatui = "0.26"
crossterm = "0.27"

[profile.release]
strip = true
lto = true
